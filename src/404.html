<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Pousada Lagoa Azul</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Estilos embutidos: esta página pode abrir em qualquer endereço do site -->
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        font-family: 'Inter', system-ui, sans-serif;
        color: #ffffff;
        text-align: center;
        background: linear-gradient(160deg, #0a5a62 0%, #0e7c86 55%, #3fa7a8 100%);
      }
      main {
        max-width: 520px;
      }
      .wave {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      .code {
        letter-spacing: 4px;
        font-weight: 600;
        opacity: 0.8;
        font-size: 0.85rem;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(2rem, 6vw, 2.8rem);
        margin: 0.5rem 0 1rem;
        line-height: 1.2;
      }
      p {
        opacity: 0.92;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: #e9a23b;
        color: #2b2116;
        padding: 0.85rem 1.8rem;
        border-radius: 50px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #d18a24;
      }
      a:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wave" aria-hidden="true">🌊</div>
      <p class="code">ERRO 404</p>
      <h1>Essa onda levou a página embora</h1>
      <p>
        O endereço que você acessou não existe ou mudou de lugar. Que tal voltar para o início e conhecer a pousada?
      </p>
      <a href="/pousada-site/" id="voltar">Voltar para o início</a>
    </main>
    <script>
      // Funciona tanto no GitHub Pages (/pousada-site/) quanto em domínio próprio (/)
      const base = location.pathname.startsWith('/pousada-site') ? '/pousada-site/' : '/';
      document.getElementById('voltar').href = base;
    </script>
  </body>
</html>
